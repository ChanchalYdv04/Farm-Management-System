<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Details | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Farmer Information</h1>
    <p>Detailed profile and contact records for ground-level operations.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html" class="active">Farmer</a>
    <a href="crop.html">Crops</a>
    <a href="harvester.html">Harvester</a>
    <a href="farm_plot.html">Plots</a>
    <a href="livestock.html">Livestock</a>
    <a href="tool.html">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🧑‍🌾 Profile Details</h2>
    <div id="farmerDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const farmerContainer = document.getElementById("farmerDetails");
    farmerData.farmerDetails.forEach(farmer => {
      farmerContainer.innerHTML += `
        <div class="farmer-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Farmer ID</span>
            <span>${farmer.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Full Name</span>
            <span>${farmer.name}</span>
          </div>
          <div class="data-row">
            <span class="label">Phone Number</span>
            <span>${farmer.Pnum}</span>
          </div>
          <div class="data-row">
            <span class="label">Address</span>
            <span>${farmer.Add}</span>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
