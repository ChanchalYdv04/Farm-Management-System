<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestock Details | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Livestock Information</h1>
    <p>Health monitoring, census tracking, and nutritional schedules for your herd.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html">Farmer</a>
    <a href="crop.html">Crops</a>
    <a href="harvester.html">Harvester</a>
    <a href="farm_plot.html">Plots</a>
    <a href="livestock.html" class="active">Livestock</a>
    <a href="tool.html">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🐄 Herd Management</h2>
    <div id="livestockDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const livestockContainer = document.getElementById("livestockDetails");
    farmerData.livestockDetails.forEach(animal => {
      livestockContainer.innerHTML += `
        <div class="animal-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Animal tag ID</span>
            <span>${animal.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Species & Breed</span>
            <span>${animal.species} (${animal.breed})</span>
          </div>
          <div class="data-row">
            <span class="label">Health Status</span>
            <span style="color: ${animal.health === 'Healthy' ? 'var(--secondary)' : '#e63946'}; font-weight: bold;">${animal.health}</span>
          </div>
          <div class="data-row">
            <span class="label">Feeding Schedule</span>
            <span>${animal.schedule}</span>
          </div>
        </div>
        <hr style="opacity: 0.1; margin: 15px 0;">
      `;
    });
  </script>
</body>
</html>
