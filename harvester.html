<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harvester Details | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Harvester Information</h1>
    <p>Manage and track your harvester fleets and operating staff.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html">Farmer</a>
    <a href="crop.html">Crops</a>
    <a href="harvester.html" class="active">Harvester</a>
    <a href="farm_plot.html">Plots</a>
    <a href="livestock.html">Livestock</a>
    <a href="tool.html">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🚜 Harvester Fleet</h2>
    <div id="harvesterDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const harvesterContainer = document.getElementById("harvesterDetails");
    farmerData.harvesterDetails.forEach(harvester => {
      harvesterContainer.innerHTML += `
        <div class="harvester-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Harvester ID</span>
            <span>${harvester.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Primary Name</span>
            <span>${harvester.name}</span>
          </div>
          <div class="data-row">
            <span class="label">Phone Number</span>
            <span>${harvester.Pnum}</span>
          </div>
          <div class="data-row">
            <span class="label">Email Address</span>
            <span>${harvester.email}</span>
          </div>
        </div>
        <hr style="opacity: 0.1; margin: 15px 0;">
      `;
    });
  </script>
</body>
</html>
