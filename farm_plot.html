<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Plot Details | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Farm Plot Information</h1>
    <p>Spatial analysis and soil tracking for every plot in your farm.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html">Farmer</a>
    <a href="crop.html">Crops</a>
    <a href="harvester.html">Harvester</a>
    <a href="farm_plot.html" class="active">Plots</a>
    <a href="livestock.html">Livestock</a>
    <a href="tool.html">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🗺️ Plot Mapping</h2>
    <div id="plotDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const plotContainer = document.getElementById("plotDetails");
    farmerData.plotDetails.forEach(plot => {
      plotContainer.innerHTML += `
        <div class="plot-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Plot ID</span>
            <span>${plot.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Total Size</span>
            <span style="font-weight: 600;">${plot.size} Acres</span>
          </div>
          <div class="data-row">
            <span class="label">Soil Composition</span>
            <span style="color: var(--primary); font-weight: 500;">${plot.soil}</span>
          </div>
          <div class="data-row">
            <span class="label">Geolocation</span>
            <span>${plot.Add}</span>
          </div>
        </div>
        <hr style="opacity: 0.1; margin: 15px 0;">
      `;
    });
  </script>
</body>
</html>
