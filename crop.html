<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crops Details | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Crops Information</h1>
    <p>Monitor your harvest tracking, yields, and planting schedules.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html">Farmer</a>
    <a href="crop.html" class="active">Crops</a>
    <a href="harvester.html">Harvester</a>
    <a href="farm_plot.html">Plots</a>
    <a href="livestock.html">Livestock</a>
    <a href="tool.html">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🌱 Crop Statistics</h2>
    <div id="cropDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const cropContainer = document.getElementById("cropDetails");
    farmerData.cropDetails.forEach(crop => {
      cropContainer.innerHTML += `
        <div class="crop-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Crop ID</span>
            <span>${crop.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Crop Name</span>
            <span>${crop.name}</span>
          </div>
          <div class="data-row">
            <span class="label">Yield Count</span>
            <span style="color: var(--secondary); font-weight: bold;">${crop.yield}</span>
          </div>
          <div class="data-row">
            <span class="label">Planting Date</span>
            <span>${crop.planting}</span>
          </div>
          <div class="data-row">
            <span class="label">Harvesting Date</span>
            <span>${crop.harvesting}</span>
          </div>
        </div>
        <hr style="opacity: 0.1; margin: 15px 0;">
      `;
    });
  </script>
</body>
</html>
