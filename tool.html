<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools & Equipment | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <header>
    <h1>Tools & Equipment</h1>
    <p>Inventory and lifecycle management for all agricultural machinery and assets.</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="farmer.html">Farmer</a>
    <a href="crop.html">Crops</a>
    <a href="harvester.html">Harvester</a>
    <a href="farm_plot.html">Plots</a>
    <a href="livestock.html">Livestock</a>
    <a href="tool.html" class="active">Tools</a>
    <a href="maintenance.html">Maintenance</a>
    <button class="logout-btn" onclick="logout()" style="margin-left: auto;">Logout</button>
  </nav>

  <div class="content-container animate">
    <h2 style="margin-bottom: 25px; border-bottom: 2px solid var(--accent); display: inline-block;">🛠️ Asset Inventory</h2>
    <div id="toolDetails"></div>
  </div>

  <footer>
    <p>&copy; 2026 Farm Management System. All rights reserved.</p>
  </footer>

  <script src="farmerData.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("loggedInId");
      window.location.href = "auth.html";
    }

    const farmerId = localStorage.getItem("loggedInId");
    const farmerData = window.farmerDatabase[farmerId];

    if (!farmerData) {
      alert("Please login first.");
      window.location.href = "auth.html";
    }

    const toolContainer = document.getElementById("toolDetails");
    farmerData.toolDetails.forEach(tool => {
      toolContainer.innerHTML += `
        <div class="tool-card" style="padding: 10px 0;">
          <div class="data-row">
            <span class="label">Asset ID</span>
            <span>${tool.id}</span>
          </div>
          <div class="data-row">
            <span class="label">Equipment Type</span>
            <span>${tool.type}</span>
          </div>
          <div class="data-row">
            <span class="label">Purchase History</span>
            <span>${tool.date}</span>
          </div>
        </div>
        <hr style="opacity: 0.1; margin: 15px 0;">
      `;
    });
  </script>
</body>
</html>
