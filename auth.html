<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farm Login / Signup | Farm Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <img src="bg-login.png" class="bg-layer" alt="Farm Background">
  <div class="bg-overlay"></div>

  <div class="auth-container">
    <div class="auth-card animate">
      <h1 style="color: var(--primary-dark); font-size: 2.2rem; margin-bottom: 20px;">Farm Management</h1>
      <p style="color: var(--text-muted); margin-bottom: 30px; font-weight: 500;">Welcome back, Farmer!</p>
      
      <div class="tabs">
        <button onclick="switchTab('login')" id="loginTab" class="active">Login</button>
        <button onclick="switchTab('signup')" id="signupTab">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="active-form" onsubmit="login(event)" style="display: flex; flex-direction: column;">
        <input type="text" id="loginId" placeholder="Farmer ID" required />
        <input type="password" id="loginPass" placeholder="Password" required />
        <button type="submit" class="btn" style="margin-top: 15px; width: 100%;">Access Dashboard</button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="signup(event)" style="display: none; flex-direction: column;">
        <input type="text" id="signupId" placeholder="Create Farmer ID" required />
        <input type="password" id="signupPass" placeholder="Create Password" required />
        <button type="submit" class="btn" style="margin-top: 15px; width: 100%;">Register Account</button>
      </form>
    </div>
  </div>

  <script>
    // Style fix for visibility
    function updateFormDisplay() {
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");

      if (loginTab.classList.contains("active")) {
        loginForm.style.display = "flex";
        signupForm.style.display = "none";
      } else {
        loginForm.style.display = "none";
        signupForm.style.display = "flex";
      }
    }

    function switchTab(tab) {
      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("signupTab").classList.remove("active");
      document.getElementById(tab + "Tab").classList.add("active");
      updateFormDisplay();
    }

    function signup(event) {
      event.preventDefault();
      const id = document.getElementById("signupId").value;
      const pass = document.getElementById("signupPass").value;
      
      // Fixed: Removed undefined 'name'
      const user = { id, pass };
      localStorage.setItem("user_" + id, JSON.stringify(user));
      
      alert("Registration successful! You can now login.");
      switchTab('login');
      document.getElementById("loginId").value = id;
    }

    function login(event) {
      event.preventDefault();
      const id = document.getElementById("loginId").value;
      const pass = document.getElementById("loginPass").value;
      
      const storedUser = localStorage.getItem("user_" + id);
      if (storedUser) {
        const user = JSON.parse(storedUser);
        if (user.pass === pass) {
          localStorage.setItem("loggedInId", id);
          window.location.href = "index.html"; 
          return;
        }
      }
      
      alert("Invalid credentials. Please check your ID and Password.");
    }

    // Initial check
    updateFormDisplay();
  </script>
</body>
</html>
